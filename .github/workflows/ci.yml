name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  testes:
    name: testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install -r requirements.txt pytest
      - name: Testes
        run: pytest -q
      - name: Análise do projeto de exemplo
        run: python -m crlocal exemplos/projeto-ruim --saida relatorio --lang pt
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: relatorio-exemplo
          path: relatorio/
