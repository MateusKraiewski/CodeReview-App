name: Instalador Windows

# PR: gera e testa o instalador (baixe em "Artifacts" na página da execução).
# Tag v*: publica o instalador e o .zip portátil na página de Releases.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versão
        id: versao
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.1.0-dev.${{ github.run_number }}" }
          "valor=$v" >> $env:GITHUB_OUTPUT

      - name: Dependências Python
        run: pip install lizard bandit ruff PyYAML reportlab customtkinter pyinstaller

      - name: Semgrep (opcional no Windows)
        continue-on-error: true
        run: pip install semgrep

      - name: Baixar ferramentas (Gitleaks, OSV-Scanner, Ruff, DevSkim)
        shell: pwsh
        run: ./scripts/baixar_ferramentas.ps1

      - name: Baixar regras do Semgrep
        continue-on-error: true
        run: python scripts/baixar_regras.py

      - name: Gravar a versão no app
        shell: pwsh
        run: |
          (Get-Content crlocal/__init__.py) -replace '__version__ = ".*"', '__version__ = "${{ steps.versao.outputs.valor }}"' | Set-Content crlocal/__init__.py
          Get-Content crlocal/__init__.py

      - name: Gerar o app com PyInstaller
        run: pyinstaller build/CodeReviewLocal.spec --noconfirm --distpath dist --workpath build/tmp

      - name: Testar o .exe gerado (uma skill por vez, com tempo limite)
        id: teste
        continue-on-error: true
        timeout-minutes: 20
        shell: pwsh
        run: |
          $exe = "dist/CodeReviewLocal/CodeReviewLocal.exe"
          $skills = "segredos","seguranca-sast","seguranca-devskim","seguranca-python","dependencias","qualidade-csharp","qualidade-python","complexidade","duplicacao","testes","padroes"
          $falhas = @()
          New-Item -ItemType Directory -Force teste-exe | Out-Null
          foreach ($s in $skills) {
            $resumo = "teste-exe/resumo-$s.json"
            $t = [Diagnostics.Stopwatch]::StartNew()
            $p = Start-Process $exe -ArgumentList "exemplos/projeto-ruim","--skills",$s,"--resumo",$resumo -PassThru
            if (-not $p.WaitForExit(180000)) {
              $filhos = @(Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $p.Id })
              $netos = @($filhos | ForEach-Object { $f = $_; Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $f.ProcessId } })
              $presos = ($filhos + $netos | ForEach-Object { $_.Name }) -join ","
              Stop-Process -Id $p.Id -Force
              Get-CimInstance Win32_Process -Filter "Name='CodeReviewLocal.exe'" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
              "{0,-20} TRAVOU (mais de 180s)" -f $s; $falhas += "$s travou (processos: $presos)"; continue
            }
            if (-not (Test-Path $resumo)) { "{0,-20} sem resumo (código {1})" -f $s, $p.ExitCode; $falhas += "$s sem resumo"; continue }
            $r = (Get-Content $resumo -Raw | ConvertFrom-Json).$s
            "{0,-20} {1,-8} {2,4} achados  {3,5:N1}s  {4}" -f $s, $r.status, $r.achados, $t.Elapsed.TotalSeconds, $r.mensagem
            if ($r.status -eq "error") { $falhas += "$s erro: $($r.mensagem)" }
          }
          # relatório completo com as skills que rodaram
          $p = Start-Process $exe -ArgumentList "exemplos/projeto-ruim","--skills","segredos,seguranca-python,qualidade-python,complexidade,duplicacao,testes,padroes","--saida","teste-exe" -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; $falhas += "relatório completo travou" }
          if (-not (Get-ChildItem teste-exe -Filter *.pdf)) { $falhas += "PDF não gerado" }
          if (-not (Get-ChildItem teste-exe -Filter *.md)) { $falhas += "Markdown não gerado" }
          # crlocal.exe (console): saída no terminal e servidor MCP
          $cli = "dist/CodeReviewLocal/crlocal.exe"
          if (-not (Test-Path $cli)) { $falhas += "crlocal.exe não gerado" } else {
            & $cli --listar | Select-Object -First 3
            $entrada = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' + "`n" + '{"jsonrpc":"2.0","id":2,"method":"tools/list"}'
            $saida = $entrada | & $cli --mcp
            "MCP: $($saida | Select-Object -Last 1)".Substring(0, 120)
            if (-not ($saida -match '"code_review"')) { $falhas += "servidor MCP não respondeu" }
            $problemas = & $cli exemplos/projeto-ruim --skills padroes --problemas
            if (-not ($problemas -match ':\d+:1: (error|warning|info): ')) { $falhas += "saída --problemas inválida" }
          }
          foreach ($f in $falhas) { Write-Output "::error title=Teste do .exe::$f" }  # aparece nas anotações do job
          if ($falhas) { throw ("Falhas no .exe: " + ($falhas -join "; ")) }

      - name: Gerar o instalador (Inno Setup)
        if: always()
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=${{ steps.versao.outputs.valor }}" installer/CodeReviewLocal.iss
          if ($LASTEXITCODE -ne 0) { throw "Falha no Inno Setup" }
          Compress-Archive -Path dist/CodeReviewLocal -DestinationPath "dist/CodeReviewLocal-${{ steps.versao.outputs.valor }}-portatil.zip"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CodeReviewLocal-Setup-${{ steps.versao.outputs.valor }}
          path: |
            dist/CodeReviewLocal-Setup-*.exe
            dist/CodeReviewLocal-*-portatil.zip
            teste-exe/

      - name: Falhar o job se o teste do .exe falhou
        if: steps.teste.outcome != 'success'
        run: exit 1

      - name: Publicar Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: CodeReview Local ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/CodeReviewLocal-Setup-*.exe
            dist/CodeReviewLocal-*-portatil.zip
